# Docker Compose Override for Development/Testing
# This file exposes service ports for development and testing purposes
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --wait
#
# Or set COMPOSE_FILE environment variable:
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml
#   docker compose up -d --wait
services:
  api_server:
    ports:
      - "8080:8080"
    environment:
      - LEARNING_SERVICE_URL=http://learning_service:8001

  relational_db:
    image: pgvector/pgvector:pg15
    ports:
      - "5432:5432"

  index:
    ports:
      - "19071:19071"
      - "8081:8081"

  inference_model_server:
    ports:
      - "9000:9000"

  cache:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9004:9000"
      - "9005:9001"

  code-interpreter:
    ports:
      - "8000:8000"

  learning_service:
    image: 982733204083.dkr.ecr.ap-south-1.amazonaws.com/learning-service:latest
    container_name: learning_service
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@relational_db:5432/postgres
      - DB_SCHEMA=learning
      - LEARNING_SERVICE_PORT=8001
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AIRTOP_API_KEY=${AIRTOP_API_KEY}
      - CATEGORIES_MD_DIR=${CATEGORIES_MD_DIR}
    depends_on:
      relational_db:
        condition: service_healthy
    volumes:
      - ../../openclaw_learning/workspace:/workspace

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    depends_on:
      relational_db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pgadmin_data:
